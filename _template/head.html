<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KIJA Financial & Operations Dashboard · Jababeka (IDX: KIJA)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231F5E40'/%3E%3Ctext x='32' y='46' font-size='38' text-anchor='middle' fill='%23F1F4EE' font-family='Arial' font-weight='700'%3EK%3C/text%3E%3C/svg%3E">
<style>
:root{
  --ink:#16241C; --paper:#EFF2EC; --card:#FFFFFF; --line:#DCE3D9;
  --green:#1F5E40; --green2:#4A8B66; --teal:#3E7D6B; --amber:#C07A2D; --clay:#B04A2E;
  --muted:#5C6B61; --ok:#2E7D4F; --warn:#C07A2D; --high:#B04A2E; --soft:#E4E9E0;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:auto}
body{font-family:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;background:var(--paper);color:var(--ink);line-height:1.55;font-size:14px}
header{background:var(--ink);color:#EDF2EC;padding:16px 22px 14px}
.hd-inner{max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hd-title{display:flex;align-items:center;gap:12px}
.logo{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:9px;background:var(--green);color:#EDF2EC;font-size:22px;font-weight:800}
.hd-title h1{font-size:20px;font-weight:700;letter-spacing:.3px}
.hd-title p{font-size:12px;color:#AFC2B4;margin-top:1px}
.hd-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.hd-meta{font-size:11px;color:#AFC2B4;text-align:right;line-height:1.6}
.langs{display:inline-flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);border-radius:8px;overflow:hidden}
.langs button{border:none;background:transparent;color:#C9D8CE;font-size:12px;padding:5px 13px;cursor:pointer;font-family:inherit}
.langs button+button{border-left:1px solid rgba(255,255,255,.22)}
.langs button.active{background:var(--green);color:#fff;font-weight:600}
nav.tabs{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}
.tabs-inner{max-width:1180px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:0 12px}
a.tab{display:inline-block;padding:11px 15px;font-size:13.5px;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap}
a.tab:hover{color:var(--green)}
a.tab.active{color:var(--green);border-bottom-color:var(--green);font-weight:600}
main{max-width:1180px;margin:0 auto;padding:18px 22px 34px}
.page{display:none}
.page.active{display:block}
.page-h{font-size:17px;font-weight:700;margin-bottom:4px}
.page-d{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.block-h{font-size:15px;font-weight:600;margin:6px 0 10px}
.phase{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 16px}
.chip{font-size:12px;color:var(--muted);border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 12px}
.chip b{color:var(--green)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:11px;margin-bottom:18px}
.kpis:has(> :nth-child(4):last-child){grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis:has(> :nth-child(6):last-child){grid-template-columns:repeat(6,minmax(0,1fr))}
.kpis:has(> :nth-child(8):last-child){grid-template-columns:repeat(8,minmax(0,1fr))}
@media(max-width:1199px){
  .kpis:has(> :nth-child(4):last-child){grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis:has(> :nth-child(6):last-child){grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpis:has(> :nth-child(8):last-child){grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media(max-width:699px){
  .kpis:has(> :nth-child(4):last-child){grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis:has(> :nth-child(6):last-child){grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis:has(> :nth-child(8):last-child){grid-template-columns:repeat(2,minmax(0,1fr))}
}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px 13px}
.kpi .lbl{font-size:12px;color:var(--muted)}
.kpi .val{font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;margin:2px 0 1px;line-height:1.2}
.kpi .val small{font-size:12px;font-weight:500;color:var(--muted)}
.kpi .del{font-size:12px;font-variant-numeric:tabular-nums}
.up{color:var(--ok)}.dn{color:var(--high)}.flat{color:var(--muted)}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:18px}
.chart-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px 8px}
.chart-card h3{font-size:14px;font-weight:600;margin-bottom:2px}
.chart-card .sub{font-size:11px;color:var(--muted);margin-bottom:6px}
.chart{width:100%;height:300px}
#v-1{height:430px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:18px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:13px 15px}
.panel h3{font-size:14px;font-weight:600;margin-bottom:8px}
.panel h3 .hint{font-weight:400;font-size:11px;color:var(--muted)}
ul.events{list-style:none}
ul.events li{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
ul.events li:last-child{border-bottom:none}
ul.events .d{flex:none;width:76px;color:var(--green);font-weight:600;font-variant-numeric:tabular-nums;font-size:12px;padding-top:1px}
.risk-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.risk-row:last-child{border-bottom:none}
.risk-row .nm{flex:1 1 34%;min-width:120px}
.risk-row .vv{flex:1 1 22%;font-weight:600;font-variant-numeric:tabular-nums;min-width:90px}
.risk-row .bar{flex:1 1 22%;height:7px;background:var(--soft);border-radius:4px;overflow:hidden;min-width:60px}
.risk-row .bar i{display:block;height:100%}
.badge{flex:none;font-size:11px;font-weight:600;border-radius:10px;padding:1px 9px;min-width:44px;text-align:center}
.lv-low{background:#DDEBDD;color:#1F5E40}
.lv-mid{background:#F3E3C8;color:#8A5A14}
.lv-high{background:#F0D5CC;color:#8F3520}
.risk-note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
.dir-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:11px;margin-bottom:18px}
.dir{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.dir .n{font-size:11px;font-weight:700;color:var(--green);letter-spacing:.5px}
.dir h4{font-size:14px;margin:3px 0 4px}
.dir p{font-size:12.5px;color:var(--muted)}
.tl{--date:66px;--axis:26px;--gap:12px;display:grid;grid-template-columns:var(--date) var(--axis) 1fr;column-gap:var(--gap);position:relative}
.tl::before{content:"";position:absolute;left:calc(var(--date) + var(--gap) + var(--axis)/2 - 1px);top:8px;bottom:8px;width:2px;background:var(--line)}
.tl .yr{font-weight:700;color:var(--green);text-align:right;padding-top:2px;font-size:15px}
.tl .dot{width:13px;height:13px;border-radius:50%;background:var(--green);justify-self:center;margin-top:5px;position:relative;z-index:1}
.tl .ev{margin-bottom:13px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px}
.tl .ev b{color:var(--green)}
.tl .ev .m{color:var(--muted);font-size:12px;margin-top:2px}
/* ===== 股权结构页 ===== */
.own-bars{display:flex;flex-direction:column;gap:9px;margin-bottom:18px}
.own-row{display:flex;align-items:center;gap:12px;font-size:13px}
.own-row .nm{flex:0 0 240px;color:var(--muted)}
.own-row .bar{flex:1;height:14px;background:var(--soft);border-radius:7px;overflow:hidden}
.own-row .bar i{display:block;height:100%;background:var(--green)}
.own-row .bar i.hl{background:var(--teal)}
.own-row .bar i.hl2{background:var(--green2)}
.own-row .vv{flex:0 0 90px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.hld{display:flex;flex-direction:column;align-items:center;margin-bottom:18px}
.hld-top{border:1px solid var(--ink);background:var(--ink);color:#EDF2EC;border-radius:9px;padding:9px 22px;text-align:center;min-width:260px}
.hld-top b{font-size:15px;display:block}
.hld-top span{font-size:11.5px;color:#AFC2B4}
.hld-line{width:2px;height:20px;background:var(--line)}
.hld-pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;position:relative}
.hld-pillars::before{content:"";position:absolute;top:-20px;left:16%;right:16%;height:2px;background:var(--line)}
.hld-pillar{border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px 10px 8px}
.hld-pillar h4{font-size:13px;margin-bottom:2px}
.hld-pillar .hld-kind{font-size:11px;color:var(--muted);margin-bottom:8px}
.hld-ents{display:flex;flex-direction:column;gap:6px}
.hld-ent{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:12.5px;padding:5px 8px;border:1px solid #E6EBE4;border-radius:6px;background:#FAFBF8;line-height:1.3}
.hld-ent .nm{font-weight:600}
.hld-ent .sub{font-size:11px;color:var(--muted);display:block}
.hld-ent .p{flex:none;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums}
.hld-ent.jv{border-color:#EAD9BC}
.hld-ent.jv .p{color:var(--amber)}
.hld-more{font-size:11.5px;color:var(--muted);margin-top:7px}
/* ===== 公司治理/组织页 ===== */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:18px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px 13px}
.fact .lbl{font-size:11.5px;color:var(--muted)}
.fact .val{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;line-height:1.25}
.fact .val small{font-size:11.5px;font-weight:500;color:var(--muted)}
.org{display:flex;flex-direction:column;align-items:center}
.org-box{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 18px;text-align:center;min-width:230px}
.org-box b{display:block;font-size:13.5px;line-height:1.35}
.org-box span{font-size:11.5px;color:var(--muted)}
.org-box.dark{background:var(--ink);border-color:var(--ink)}
.org-box.dark b{color:#EDF2EC}
.org-box.dark span{color:#AFC2B4}
.org-box.green{background:var(--green);border-color:var(--green)}
.org-box.green b{color:#fff}
.org-box.green span{color:#D6E4DA}
.org-line{width:2px;height:16px;background:var(--line);flex:none}
.org-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;width:100%;position:relative;padding-top:16px}
.org-row::before{content:"";position:absolute;top:0;left:12%;right:12%;height:2px;background:var(--line)}
.org-col{display:flex;flex-direction:column;align-items:center;flex:1 1 150px;max-width:230px}
.org-col .vline{width:2px;height:14px;background:var(--line);flex:none}
.g-table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:12.5px;table-layout:fixed;margin-bottom:18px}
.g-table th{background:var(--ink);color:#EDF2EC;padding:7px 9px;text-align:left;font-weight:600;font-size:12px;overflow-wrap:break-word;word-break:break-word}
.g-table td{padding:6px 9px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:top;overflow-wrap:break-word;word-break:break-word}
.g-table .gterm{white-space:normal}
.g-table tr:nth-child(even) td{background:#F7F9F5}
.g-table td.b{font-weight:700}
.g-table td.p{text-align:right;color:var(--green);font-weight:600}
.g-table td.amber{color:var(--amber);font-weight:600}
.g-table .gname{color:var(--muted);font-size:11.5px;font-weight:600;background:#EFF2EC}
.g-table-wrap{width:100%;overflow-x:auto;margin-bottom:18px}
.g-table-wrap .g-table{margin-bottom:0;min-width:640px}
footer{max-width:1180px;margin:0 auto;padding:6px 22px 30px;font-size:11px;color:var(--muted);line-height:1.7}
footer a{color:var(--green)}
.ft-ver{margin-top:8px;font-weight:600;color:var(--ink)}
.ft-log{margin-top:4px;font-weight:400}
.ft-log summary{cursor:pointer;color:var(--green);display:inline}
.ft-log ul{margin:6px 0 0 18px;padding:0}
.ft-log li{margin:2px 0}
.hl-driver{border-left:3px solid var(--green);margin-top:14px}
.hl-driver p{margin:6px 0 0}
#csvBtn{position:fixed;right:16px;bottom:16px;z-index:99;background:var(--ink);color:#EDF2EC;border:none;border-radius:20px;padding:8px 14px;font-size:12px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#csvBtn:hover{background:var(--green)}
@media(max-width:900px){
  .charts,.two-col{grid-template-columns:1fr}
  .chart{height:280px}
  .hd-right,.hd-meta{text-align:left;align-items:flex-start}
  main{padding:14px 14px 30px}
  .hld-pillars{grid-template-columns:1fr}
  .hld-pillars::before{display:none}
  .own-row .nm{flex-basis:150px}
}
/* ===== 术语悬停解释 ===== */
.gterm{border-bottom:1px dotted rgba(31,94,64,.55);cursor:help;white-space:nowrap}
.gterm.gterm-long{white-space:normal}
.gterm-q{display:inline-block;margin-left:1px;width:1.1em;height:1.1em;line-height:1.15em;text-align:center;border-radius:50%;background:rgba(176,74,46,.13);color:var(--high);font-size:.62em;font-weight:800;vertical-align:super;cursor:help}
.gterm-tip{position:fixed;z-index:3000;max-width:320px;background:var(--ink);color:#F2F5F1;font-size:12px;line-height:1.55;padding:8px 10px;border-radius:6px;box-shadow:0 8px 22px rgba(0,0,0,.3);display:none;pointer-events:auto;word-wrap:break-word}
.gterm-tip::before{content:"";position:absolute;left:12px;bottom:-5px;width:10px;height:10px;background:var(--ink);transform:rotate(45deg)}
.tab{font-weight:600}
</style>
</head>
