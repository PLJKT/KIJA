<script>
/* ================= 工具 ================= */
var LANG = 'en';
try { var _s = localStorage.getItem('kija_lang'); if (_s === 'en' || _s === 'id' || _s === 'zh') { LANG = _s; } } catch (e) {}
function T(k){ return (I18N[LANG] && I18N[LANG][k]) || k; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtN(v){
  if (v === null || v === undefined || v === '') { return ''; }
  var n = Number(v);
  if (isNaN(n)) { return String(v); }
  var s = n.toFixed(1);
  if (s.charAt(s.length - 2) === '.' && s.charAt(s.length - 1) === '0') { s = s.slice(0, -2); }
  var parts = s.split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return parts.join('.');
}
var C = {green:'#1F5E40', green2:'#4A8B66', teal:'#3E7D6B', amber:'#C07A2D', clay:'#B04A2E', soft:'#C7D0C8', blue:'#2E6FB0', purple:'#7A5BA6', red:'#C0392B', gold:'#D9A53A'};
var AX = {color:'#5C6B61', fontSize:11};
var SPLIT = {lineStyle:{color:'#E3E8E1'}};

/* ================= 年度数据与图表文案（AN / CHT / FY 由 data.json 注入；在线时运行时拉取覆盖） ================= */
function CT(k){ return CHT[LANG][k] || k; }
function N(k){ return NXT[LANG][k] || k; }

/* ================= 图表构建（按当前语言） ================= */
function baseTooltip(){ return {trigger:'axis', confine:true}; }
function baseGrid(){ return {left:48, right:18, top:34, bottom:30}; }
function baseX(cats){ return {type:'category', data:cats, axisLabel:{color:AX.color, fontSize:11}, axisLine:{lineStyle:{color:'#B9C4BB'}}}; }
function baseY(name){ return {type:'value', name:name, nameTextStyle:{color:AX.color, fontSize:11}, axisLabel:{color:AX.color, fontSize:11}, splitLine:SPLIT}; }
function lblFmt(){ return function(p){ return fmtN(p.value); }; }
function legendT(){ return {top:2, right:6, textStyle:{color:AX.color, fontSize:11}, itemWidth:14}; }

function num(s){ var n = Number(String(s).replace(/,/g, '.')); return isNaN(n) ? 0 : n; }
function buildOpt(id){
  var U = CT('unit');
  if (id === 'o1') {
    var d = AN.revenue;
    var tt = {trigger:'axis', confine:true, formatter:function(ps){
      var i = ps[0].dataIndex, s = '<b>' + AN.years[i] + '</b><br/>';
      s += CT('rev') + ': ' + fmtN(d[i]) + ' ' + U;
      if (i > 0 && d[i-1]) { var y = (d[i]/d[i-1]-1)*100; s += '<br/>YoY: ' + (y>=0?'+':'') + y.toFixed(1) + '%'; }
      return s;
    }};
    return {tooltip:tt, grid:baseGrid(), xAxis:baseX(AN.years), yAxis:baseY(U),
      series:[{type:'bar', data:d, itemStyle:{color:C.green, borderRadius:[3,3,0,0]}, label:{show:true, position:'top', fontSize:10, color:'#5C6B61', formatter:lblFmt()}, barMaxWidth:26}]};
  }
  if (id === 'o2') {
    var nc = AN.niCons, np = AN.niParent;
    var tt2 = {trigger:'axis', confine:true, formatter:function(ps){
      var i = ps[0].dataIndex, s = '<b>' + AN.years[i] + '</b>';
      for (var q=0; q<ps.length; q++){
        var ser = ps[q].seriesIndex === 0 ? nc : np, prev = ser[i-1];
        s += '<br/>' + ps[q].marker + ps[q].seriesName + ': ' + fmtN(ps[q].value) + ' ' + U;
        if (i>0 && prev) { var y2 = (ser[i]/prev-1)*100; s += ' (' + (y2>=0?'+':'') + y2.toFixed(1) + '%)'; }
      }
      return s;
    }};
    return {tooltip:tt2, legend:legendT(), grid:baseGrid(), xAxis:baseX(AN.years), yAxis:baseY(U),
      series:[
        {name:CT('cons'), type:'line', data:nc, smooth:true, symbolSize:6, lineStyle:{width:2.5, color:C.green}, itemStyle:{color:C.green}},
        {name:CT('parent'), type:'line', data:np, smooth:true, symbolSize:6, lineStyle:{width:2, color:C.amber, type:'dashed'}, itemStyle:{color:C.amber}}]};
  }
  if (id === 'o3') {
    return {tooltip:baseTooltip(), legend:legendT(), grid:baseGrid(), xAxis:baseX(AN.years), yAxis:baseY('%'),
      series:[
        {name:CT('gM'), type:'line', data:AN.gpm, smooth:true, symbolSize:5, lineStyle:{width:2, color:C.green}, itemStyle:{color:C.green}},
        {name:CT('nM'), type:'line', data:AN.npm, smooth:true, symbolSize:5, lineStyle:{width:2, color:C.blue}, itemStyle:{color:C.blue}},
        {name:CT('roe'), type:'line', data:AN.roe, smooth:true, symbolSize:5, lineStyle:{width:2, color:C.amber}, itemStyle:{color:C.amber}},
        {name:CT('de'), type:'line', data:AN.de, smooth:true, symbolSize:5, lineStyle:{width:2, color:C.red}, itemStyle:{color:C.red}}]};
  }
  if (id === 'o4') {
    return {tooltip:baseTooltip(), legend:legendT(), grid:baseGrid(), xAxis:baseX(AN.years.slice(-5)), yAxis:baseY(U),
      series:[
        {name:CT('infSeg'), type:'bar', stack:'s', data:FY.segStack.infra, itemStyle:{color:C.blue}, barMaxWidth:40},
        {name:CT('reSeg'), type:'bar', stack:'s', data:FY.segStack.re, itemStyle:{color:C.green}, barMaxWidth:40}]};
  }
  if (id === 'o5') {
    var d2 = FY.msales, lb2 = [];
    for (var j = 0; j < d2.length; j++) { lb2.push(fmtN(d2[j])); }
    return {tooltip:baseTooltip(), grid:baseGrid(), xAxis:baseX(['2022','2023','2024','2025']), yAxis:baseY(U),
      series:[{type:'bar', data:d2, itemStyle:{color:C.green, borderRadius:[3,3,0,0]}, label:{show:true, position:'top', fontSize:11, color:'#1F5E40', fontWeight:600, formatter:lblFmt()}, barMaxWidth:52}]};
  }
  if (id === 'o6') {
    var cats = [], vals = [], d3 = AN.ebitda;
    for (var k = 0; k < d3.length; k++) { if (d3[k] !== null) { cats.push(AN.years[k]); vals.push(d3[k]); } }
    return {tooltip:baseTooltip(), grid:baseGrid(), xAxis:baseX(cats), yAxis:baseY(U),
      series:[{type:'bar', data:vals, itemStyle:{color:C.green2, borderRadius:[3,3,0,0]}, label:{show:true, position:'top', fontSize:10, color:'#5C6B61', formatter:lblFmt()}, barMaxWidth:40}]};
  }
  if (id === 'p-1') {
    return {tooltip:baseTooltip(), legend:legendT(), grid:baseGrid(), xAxis:baseX(AN.years), yAxis:baseY('%'),
      series:[
        {name:CT('gM'), type:'line', data:AN.gpm, smooth:true, symbolSize:5, lineStyle:{width:2.5,color:C.green}, itemStyle:{color:C.green}},
        {name:'EBITDA margin', type:'line', data:AN.ebitdaMargin, smooth:true, symbolSize:5, lineStyle:{width:2,color:C.blue}, itemStyle:{color:C.blue}},
        {name:CT('nM'), type:'line', data:AN.npm, smooth:true, symbolSize:5, lineStyle:{width:2,color:C.amber}, itemStyle:{color:C.amber}}]};
  }
  if (id === 'p-2') {
    return {tooltip:baseTooltip(), legend:legendT(), grid:baseGrid(), xAxis:baseX(AN.years), yAxis:baseY('%'),
      series:[
        {name:'ROE', type:'line', data:AN.roe, smooth:true, symbolSize:6, lineStyle:{width:2.5,color:C.green}, itemStyle:{color:C.green}},
        {name:'ROA', type:'line', data:AN.roa, smooth:true, symbolSize:6, lineStyle:{width:2,color:C.blue}, type2:'x', itemStyle:{color:C.blue}}]};
  }
  if (id === 'p-3') {
    return {tooltip:baseTooltip(), legend:legendT(), grid:baseGrid(), xAxis:baseX(AN.years), yAxis:baseY(U),
      series:[
        {name:'EBITDA', type:'bar', data:AN.ebitda, itemStyle:{color:C.green2,barMaxWidth:24}, barMaxWidth:24},
        {name:CT('cons'), type:'line', data:AN.niCons, smooth:true, symbolSize:5, lineStyle:{width:2.5,color:C.clay}, itemStyle:{color:C.clay}}]};
  }
  if (id === 'p-4') {
    var yr=[], rev=[], gpmL=[];
    for(var pi=0; pi<AN.years.length; pi++){ yr.push(AN.years[pi]); }
    return {tooltip:baseTooltip(), legend:legendT(), grid:baseGrid(), xAxis:baseX(AN.years), yAxis:[baseY(U), baseY('%')],
      series:[
        {name:'Revenue', type:'bar', data:AN.revenue, itemStyle:{color:C.soft}, barMaxWidth:26},
        {name:CT('gM'), type:'line', yAxisIndex:1, data:AN.gpm, smooth:true, symbolSize:5, lineStyle:{width:2.5,color:C.green}, itemStyle:{color:C.green}}]};
  }
  if (id === 'd-5') {
    var ar=WC.ar, rev=WC.revenue, dso=[];
    for(var wi=0; wi<ar.length; wi++){ dso.push(ar[wi]/rev[wi]*365); }
    return {tooltip:baseTooltip(),
      legend:{bottom:0, textStyle:{color:AX.color, fontSize:11}, itemWidth:12},
      grid:{left:48, right:48, top:30, bottom:44}, xAxis:baseX(WC.years),
      yAxis:[baseY(U), baseY('days')],
      series:[
        {name:'Trade receivables (net)', type:'bar', data:ar, itemStyle:{color:C.blue}, barMaxWidth:34},
        {name:'DSO', type:'line', yAxisIndex:1, data:dso.map(function(x){return Math.round(x);}), smooth:true, symbolSize:6, lineStyle:{width:2.5,color:C.amber}, itemStyle:{color:C.amber}}]};
  }
  if (id === 'f24-1') {
    var f24s = FY.seg24, data = [];
    for (var m0 = 0; m0 < f24s.length; m0++) { data.push([CT(f24s[m0][0]), f24s[m0][1]]); }
    var ser = [], tot = 0;
    for (var m = 0; m < data.length; m++) { tot += data[m][1]; ser.push({name:data[m][0], value:data[m][1]}); }
    return {tooltip:{trigger:'item', confine:true, formatter:function(p){ return p.name + ': ' + fmtN(p.value) + ' ' + U + ' (' + p.percent + '%)'; }},
      legend:{bottom:2, textStyle:{color:AX.color, fontSize:11}, itemWidth:12},
      series:[{type:'pie', radius:['34%','66%'], center:['50%','45%'], data:ser, itemStyle:{borderColor:'#fff', borderWidth:1},
        label:{show:true, fontSize:11, color:'#16241C', formatter:function(p){ return p.name + '\n' + p.percent + '%'; }},
        labelLine:{length:10, length2:8}, color:[C.green, C.blue, C.amber, C.purple]}]};
  }
  if (id === 'f24-2') {
    return {tooltip:baseTooltip(), legend:legendT(), grid:baseGrid(), xAxis:baseX(['2023','2024','2025']), yAxis:baseY(U),
      series:[
        {name:CT('cons'), type:'bar', data:FY.ni3.cons, itemStyle:{color:C.green}, barMaxWidth:34},
        {name:CT('parent'), type:'bar', data:FY.ni3.parent, itemStyle:{color:C.amber}, barMaxWidth:34}]};
  }
  if (id === 'f24-3') {
    return {tooltip:baseTooltip(), legend:legendT(), grid:baseGrid(), xAxis:baseX(AN.years), yAxis:baseY('%'),
      series:[
        {name:CT('gM'), type:'line', data:AN.gpm, smooth:true, symbolSize:6, lineStyle:{width:2, color:C.green}, itemStyle:{color:C.green}},
        {name:CT('nM'), type:'line', data:AN.npm, smooth:true, symbolSize:6, lineStyle:{width:2, color:C.blue}, itemStyle:{color:C.blue}}]};
  }
  if (id === 'f24-4') {
    return {tooltip:baseTooltip(), legend:legendT(), grid:baseGrid(), xAxis:baseX(AN.years.slice(-5)), yAxis:baseY(U),
      series:[
        {name:CT('ta'), type:'bar', data:AN.assets.slice(-5), itemStyle:{color:C.green}, barMaxWidth:22},
        {name:CT('tl'), type:'bar', data:AN.liab.slice(-5), itemStyle:{color:C.red}, barMaxWidth:22},
        {name:CT('te'), type:'bar', data:AN.equity.slice(-5), itemStyle:{color:C.blue}, barMaxWidth:22}]};
  }
  if (id === 'f25-1') {
    var d25 = [FY.debt25.sn, FY.debt25.mandiri, FY.debt25.ccb, FY.debt25.ocbc], dcols = [C.amber, C.green, C.blue, C.purple], ser25 = [];
    for (var m25 = 0; m25 < d25.length; m25++) { ser25.push({value: d25[m25], itemStyle:{color: dcols[m25]}}); }
    return {tooltip:baseTooltip(), grid:{left:150, right:56, top:10, bottom:26},
      xAxis:{type:'value', axisLabel:{color:AX.color, fontSize:11}, splitLine:SPLIT},
      yAxis:{type:'category', data:[CT('sn'),'Bank Mandiri','China Construction Bank','OCBC NISP'], axisLabel:{color:'#16241C', fontSize:11}},
      series:[{type:'bar', data:ser25, label:{show:true, position:'right', fontSize:11, color:'#16241C', formatter:lblFmt()}, barMaxWidth:24}]};
  }
  if (id === 'f25-2') {
    return {tooltip:baseTooltip(), legend:legendT(), grid:baseGrid(), xAxis:baseX(['2023','2024','2025']), yAxis:baseY(U),
      series:[
        {name:CT('cash'), type:'bar', stack:'a', data:FY.cashStack.cash, itemStyle:{color:C.green}, barMaxWidth:46},
        {name:CT('other'), type:'bar', stack:'a', data:FY.cashStack.other, itemStyle:{color:C.soft}, barMaxWidth:46}]};
  }
  if (id === 'f25-3') {
    return {tooltip:baseTooltip(), legend:legendT(), grid:baseGrid(), xAxis:baseX(['2023','2024','2025']), yAxis:baseY('x'),
      series:[
        {name:CT('ebitdaI'), type:'line', data:FY.cov.icr, smooth:true, symbolSize:6, lineStyle:{width:2, color:C.green}, itemStyle:{color:C.green}},
        {name:CT('nd'), type:'line', data:FY.cov.nd, smooth:true, symbolSize:6, lineStyle:{width:2, color:C.red}, itemStyle:{color:C.red}}]};
  }
  if (id === 'f25-4') {
    return {tooltip:baseTooltip(), grid:baseGrid(), xAxis:baseX([CT('openC'), CT('consS'), CT('closeC')]), yAxis:baseY(U),
      series:[{type:'bar', data:[
        {value:FY.cf.open, itemStyle:{color:C.green2}},
        {value:FY.cf.surplus, itemStyle:{color:C.amber}},
        {value:FY.cf.close, itemStyle:{color:C.green}}
      ], label:{show:true, position:'top', fontSize:11, color:'#16241C', formatter:lblFmt()}, barMaxWidth:56}]};
  }
  if (id === 'f26-1') {
    return {tooltip:baseTooltip(), legend:legendT(), grid:baseGrid(), xAxis:baseX([CT('totR'), CT('infra'), CT('land'), CT('leis')]), yAxis:baseY(U),
      series:[
        {name:'1H25', type:'bar', data:FY.h26rev.h25, itemStyle:{color:C.soft}, barMaxWidth:30},
        {name:'1H26', type:'bar', data:FY.h26rev.h26, itemStyle:{color:C.green}, barMaxWidth:30}]};
  }
  if (id === 'f26-2') {
    return {tooltip:baseTooltip(), grid:baseGrid(), xAxis:baseX([CT('done')]),
      yAxis:{type:'value', max:4200, name:U, nameTextStyle:{color:AX.color, fontSize:11}, axisLabel:{color:AX.color, fontSize:11}, splitLine:SPLIT},
      series:[{type:'bar', data:[FY.msDone], itemStyle:{color:C.green, borderRadius:[3,3,0,0]}, label:{show:true, position:'top', fontSize:12, fontWeight:600, color:'#1F5E40', formatter:function(){ return fmtN(FY.msDone); }}, barMaxWidth:64,
        markLine:{silent:true, symbol:'none', lineStyle:{color:C.clay, type:'dashed', width:1.5}, data:[{yAxis:FY.msTarget, label:{formatter:CT('target'), fontSize:11, color:C.clay, position:'insideEndTop'}}]}}]};
  }
  if (id === 'f26-3') {
    return {tooltip:{trigger:'axis', confine:true, valueFormatter:function(v){ return v + '%'; }}, legend:legendT(), grid:baseGrid(),
      xAxis:baseX(['1H25','1H26']),
      yAxis:{type:'value', max:100, axisLabel:{color:AX.color, fontSize:11, formatter:'{value}%'}, splitLine:SPLIT},
      series:[
        {name:CT('recurr'), type:'bar', stack:'p', data:[FY.mix.h25[0], FY.mix.h26[0]], itemStyle:{color:C.blue}, barMaxWidth:56},
        {name:CT('land'), type:'bar', stack:'p', data:[FY.mix.h25[1], FY.mix.h26[1]], itemStyle:{color:C.green}, barMaxWidth:56}]};
  }
  if (id === 'f26-4') {
    return {tooltip:baseTooltip(), grid:{left:150, right:56, top:10, bottom:26},
      xAxis:{type:'value', axisLabel:{color:AX.color, fontSize:11}, splitLine:SPLIT},
      yAxis:{type:'category', data:[CT('fx'), CT('deriv'), CT('amort')], axisLabel:{color:'#16241C', fontSize:11}},
      series:[{type:'bar', data:[
        {value:FY.oneoff[0], itemStyle:{color:C.clay}},
        {value:FY.oneoff[1], itemStyle:{color:C.amber}},
        {value:FY.oneoff[2], itemStyle:{color:C.green2}}
      ], label:{show:true, position:'right', fontSize:11, color:'#16241C', formatter:lblFmt()}, barMaxWidth:22}]};
  }
  /* ---- 债务页 ---- */
  if (id === 'd-1') {
    var dl = DEBT.lenders26, dc = [], dv = [], dcol = [C.green, C.amber, C.blue, C.purple, C.soft];
    for (var di = 0; di < dl.length; di++) { dc.push(N(dl[di].n)); dv.push({value:dl[di].v, itemStyle:{color:dcol[dl[di].c - 1]}}); }
    return {tooltip:baseTooltip(), grid:{left:132, right:70, top:8, bottom:24},
      xAxis:{type:'value', axisLabel:{color:AX.color, fontSize:11}, splitLine:SPLIT},
      yAxis:{type:'category', data:dc, axisLabel:{color:'#16241C', fontSize:11}},
      series:[{type:'bar', data:dv, label:{show:true, position:'right', fontSize:11, color:'#16241C', formatter:lblFmt()}, barMaxWidth:22}]};
  }
  if (id === 'd-2') {
    return {tooltip:baseTooltip(), legend:legendT(), grid:baseGrid(), xAxis:baseX(DEBT.maturityYears), yAxis:baseY(U),
      series:[
        {name:N('mandiri'), type:'bar', stack:'m', data:DEBT.maturityMandiri, itemStyle:{color:C.green}, barMaxWidth:34},
        {name:N('ina'), type:'bar', stack:'m', data:DEBT.maturityINA, itemStyle:{color:C.amber}, barMaxWidth:34},
        {name:N('ocbc'), type:'bar', stack:'m', data:DEBT.maturityOCBC, itemStyle:{color:C.blue}, barMaxWidth:34,
          label:{show:true, position:'top', fontSize:10, color:'#5C6B61', formatter:function(p){ return fmtN(DEBT.maturityTot[p.dataIndex]); }}}]};
  }
  if (id === 'd-3') {
    return {tooltip:baseTooltip(), legend:legendT(), grid:baseGrid(), xAxis:baseX(['2023','2024','2025']), yAxis:baseY('x'),
      series:[
        {name:CT('ebitdaI'), type:'line', data:FY.cov.icr, smooth:true, symbolSize:6, lineStyle:{width:2, color:C.green}, itemStyle:{color:C.green}},
        {name:CT('nd'), type:'line', data:FY.cov.nd, smooth:true, symbolSize:6, lineStyle:{width:2, color:C.red}, itemStyle:{color:C.red}}]};
  }
  if (id === 'd-4') {
    return {tooltip:baseTooltip(), grid:baseGrid(), xAxis:baseX([N('sched'), N('totD')]), yAxis:baseY(U),
      series:[{type:'bar', data:[
        {value:FY.sched5y, itemStyle:{color:C.teal}},
        {value:FY.totD26, itemStyle:{color:C.amber}}
      ], label:{show:true, position:'top', fontSize:11, color:'#16241C', formatter:lblFmt()}, barMaxWidth:64,
        markLine:{silent:true, symbol:'none', lineStyle:{color:C.green, width:2}, data:[{yAxis:FY.cash26, label:{formatter:N('cash') + ' ' + fmtN(FY.cash26), fontSize:11, color:C.green, position:'insideEndTop'}}]}}]};
  }
  /* ---- 土地页 ---- */
  if (id === 'lb-1') {
    var lr = LAND.rows, lc = [], lv = [], lcol = [C.green, C.blue, C.amber, C.purple];
    for (var li = 0; li < lr.length; li++) { lc.push(lr[li].p); lv.push({value:lr[li].ha, itemStyle:{color:lcol[li]}}); }
    return {tooltip:baseTooltip(), grid:{left:168, right:72, top:10, bottom:26},
      xAxis:{type:'value', axisLabel:{color:AX.color, fontSize:11}, splitLine:SPLIT, axisLine:{show:false}, axisTick:{show:false}},
      yAxis:{type:'category', data:lc, axisLabel:{color:'#16241C', fontSize:11, margin:12}, axisLine:{show:false}, axisTick:{show:false}},
      series:[{type:'bar', data:lv, label:{show:true, position:'right', fontSize:11, color:'#16241C', formatter:lblFmt()}, barMaxWidth:22}]};
  }
  if (id === 'lb-2') {
    var lr2 = LAND.rows, n1 = [], n2 = [], n3 = [];
    for (var lj = 0; lj < lr2.length; lj++) { n1.push(lr2[lj].m2); n2.push(lr2[lj].mLo); n3.push(lr2[lj].mHi); }
    return {tooltip:baseTooltip(), legend:legendT(), grid:{left:108, right:86, top:30, bottom:26},
      xAxis:{type:'log', axisLabel:{color:AX.color, fontSize:11, formatter:function(v){ return v >= 1000 ? (v / 1000) + 'k' : v; }}, splitLine:SPLIT, axisLine:{show:false}, axisTick:{show:false}},
      yAxis:{type:'category', data:['Cikarang','Kendal','Tanjung Lesung','Morotai'], axisLabel:{color:'#16241C', fontSize:11, margin:10}, axisLine:{show:false}, axisTick:{show:false}},
      series:[
        {name:N('book'), type:'bar', data:n1, itemStyle:{color:C.green}, barMaxWidth:11, label:{show:true, position:'right', fontSize:10, color:'#5C6B61', formatter:lblFmt()}},
        {name:N('mlo'), type:'bar', data:n2, itemStyle:{color:C.soft}, barMaxWidth:11},
        {name:N('mhi'), type:'bar', data:n3, itemStyle:{color:C.amber}, barMaxWidth:11}]};
  }
  /* ---- 估值页 ---- */
  if (id === 'v-1') {
    var volArr = VAL.vol || [];
    return {
      tooltip:{trigger:'axis', confine:true,
        formatter:function(params){
          var i = params[0].dataIndex;
          var m = VAL.months[i], c = VAL.close[i], v = volArr[i] || 0;
          var rg = (VAL.range && VAL.range[i]) ? VAL.range[i] : null;
          var to = v * c / 1000;
          var s = '<b>' + m + '</b><br/>';
          if (rg) { s += 'Price range: ' + fmtN(rg[0]) + '–' + fmtN(rg[1]) + ' IDR<br/>'; }
          s += 'Volume: ' + fmtN(v) + 'M shares<br/>';
          s += 'Turnover: ~' + fmtN(to) + ' IDR bn<br/>';
          s += 'Turnover rate: ~' + (v / 20800 * 100).toFixed(1) + '%';
          return s;
        }},
      grid:[{left:48, right:18, top:36, height:'56%'},
            {left:48, right:18, top:'74%', height:'16%'}],
      xAxis:[{type:'category', data:VAL.months, gridIndex:0, axisLabel:{show:false}, axisLine:{lineStyle:{color:'#B9C4BB'}}},
             {type:'category', data:VAL.months, gridIndex:1, axisLabel:{color:AX.color, fontSize:11}, axisLine:{lineStyle:{color:'#B9C4BB'}}}],
      yAxis:[{type:'value', gridIndex:0, name:'IDR', nameTextStyle:{color:AX.color, fontSize:11}, axisLabel:{color:AX.color, fontSize:11}, splitLine:SPLIT},

function exportCSV(){
  var page = document.querySelector('.page.active');
  if(!page){ return; }
  var tables = page.querySelectorAll('table');
  var rows = [], title = '';
  for(var t=0; t<tables.length; t++){
    var trs = tables[t].querySelectorAll('tr');
    if(t>0){ rows.push([]); }
    for(var r=0; r<trs.length; r++){
      var cells = trs[r].querySelectorAll('th,td');
      var line = [];
      for(var c=0; c<cells.length; c++){ line.push('"'+(cells[c].innerText||'').replace(/"/g,'""')+'"'); }
      rows.push(line);
    }
  }
  var csv = rows.map(function(r){return r.join(',');}).join('\r\n');
  var blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'KIJA_'+(currentPage())+'_'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

  if(document.getElementById('csvBtn')){ return; }
  var btn = document.createElement('button');
  btn.id = 'csvBtn'; btn.textContent = 'CSV'; btn.title = 'Download tables on this page as CSV';

/* ================= 术语悬停解释（GLOS）================= */
var GTERM_OB = null;
function buildGtermRegex(){
  if (GTERM_OB) { return GTERM_OB; }
  var list = [];
  for (var gi = 0; gi < GLOS.terms.length; gi++) {
    list.push({p: GLOS.terms[gi].p, x: GLOS.terms[gi].x, r: GLOS.terms[gi].p.length});
  }
  list.sort(function(a, b){ return b.r - a.r; });
  var src = [];
  for (var j = 0; j < list.length; j++) { src.push('(' + list[j].p + ')'); }
  GTERM_OB = {re: new RegExp(src.join('|'), 'g'), list: list};
  return GTERM_OB;
}
function annotateTerms(root){
  var G = buildGtermRegex();
  var rootEl = root || document.body;
  var walker = document.createTreeWalker(rootEl, NodeFilter.SHOW_TEXT, null, false);
  var nodes = [];
  while (walker.nextNode()) { nodes.push(walker.currentNode); }
  var wrapped = 0;
  var seen = {};
  for (var n = 0; n < nodes.length; n++) {
    var node = nodes[n];
    if (!node.nodeValue) { continue; }
    var p = node.parentNode;
    if (!p || p.nodeType !== 1) { continue; }
    if (p.getAttribute('data-gterm')) { continue; }
    if (p.closest && p.closest('.gterm')) { continue; }
    var t = node.nodeValue;
    G.re.lastIndex = 0;
    var m = G.re.exec(t);
    if (!m) { continue; }
    G.re.lastIndex = 0;
    var parts = [];
    var last = 0;
    var mm;
    while ((mm = G.re.exec(t)) !== null) {
      if (mm.index > last) { parts.push(t.slice(last, mm.index)); }
      var gidx = 1;
      while (gidx < mm.length && mm[gidx] === undefined) { gidx++; }
      var full = mm[0];
      var entry = G.list[gidx - 1];
      var key = (entry.p || full).toLowerCase();
      if (seen[key]) {
        parts.push(esc(full));
      } else {
        seen[key] = 1;
        parts.push('<span class="gterm' + (full.length > 10 ? ' gterm-long' : '') + '" data-gterm="1" data-tip="' + esc(entry.x) + '">' + esc(full) + '<sup class="gterm-q">?</sup></span>');
      }
      last = mm.index + full.length;
      if (G.re.lastIndex === mm.index) { G.re.lastIndex = mm.index + full.length; }
    }
    if (last < t.length) { parts.push(t.slice(last)); }
    if (parts.length > 1) {
      var span = document.createElement('span');
      span.className = 'gterm-rt';
      span.innerHTML = parts.join('');
      p.replaceChild(span, node);
      wrapped++;
    }
  }
  return wrapped;
}
function gtermTarget(node){
  while (node && node.nodeType === 1) {
    if (node.getAttribute && node.getAttribute('data-gterm')) { return node; }
    node = node.parentNode;
  }
  return null;
}
function showTip(term){
  var tip = document.getElementById('gterm-tip');
  if (!tip) {
    tip = document.createElement('div');
    tip.id = 'gterm-tip';
    tip.className = 'gterm-tip';
    tip.setAttribute('role', 'tooltip');
    document.body.appendChild(tip);
  }
  tip.innerHTML = esc(term.getAttribute('data-tip') || '');
  tip.style.display = 'block';
  var r = term.getBoundingClientRect();
  var tw = tip.offsetWidth;
  var th = tip.offsetHeight;
  var x = r.left + r.width / 2 - tw / 2;
  if (x < 8) { x = 8; }
  if (x + tw > window.innerWidth - 8) { x = window.innerWidth - tw - 8; }
  var y = r.top - th - 10;
  if (y < 8) { y = r.bottom + 10; }
  tip.style.left = x + 'px';
  tip.style.top = y + 'px';
  tip._t = term;
}
function hideTip(){ var tip = document.getElementById('gterm-tip'); if (tip) { tip.style.display = 'none'; } }
document.addEventListener('mouseover', function(ev){
  var target = gtermTarget(ev.target);
  if (target) { showTip(target); } else { hideTip(); }
});
document.addEventListener('mouseout', function(ev){
  var t = gtermTarget(ev.target);
  if (t) { var rel = ev.relatedTarget; if (!rel || !gtermTarget(rel)) { hideTip(); } }
});
document.addEventListener('click', function(ev){
  var t = gtermTarget(ev.target);
  if (!t) { return; }
  var tip = document.getElementById('gterm-tip');
  if (tip && tip.style.display === 'block' && tip._t === t) { hideTip(); } else { showTip(t); }
});
window.addEventListener('scroll', hideTip, true);
window.addEventListener('resize', hideTip);

/* ================= 数据加载：优先在线拉取 data.json，失败回退内嵌副本 ================= */
var DATA_KEYS = ["KP","EV","RK","DIR","TL","OWN","SUBS","BIZ","VIA","PILLAR","PILLAR_MAP","ORG","DEBT","LAND","VAL","DTXT","LTXT","VTXT","NXT","VALI","LIQ","KEYP","AN","CHT","FY","LBV","GLOS"];
function applyData(d){
  if (!d) { return; }
  for (var i = 0; i < DATA_KEYS.length; i++) {
    var k = DATA_KEYS[i];
    if (d[k] !== undefined) { window[k] = d[k]; }
  }
}
function loadData(cb){
  var done = false;
  function fin(){ if (!done) { done = true; cb(); } }
  if (location.protocol !== 'http:' && location.protocol !== 'https:') { fin(); return; }
  try {
    var r = new XMLHttpRequest();
    r.open('GET', 'data.json', true);
    r.onreadystatechange = function(){
      if (r.readyState === 4) {
        if (r.status === 200) {
          try { applyData(JSON.parse(r.responseText)); } catch (e) {}
        }
        fin();
      }
    };
    r.onerror = fin;
    r.send(null);
    setTimeout(fin, 5000);
  } catch (e) { fin(); }
}
function boot(){
  renderStatics();
  showPage(currentPage());
  loadECharts(function(){ renderPage(currentPage()); });
}
loadData(boot);
