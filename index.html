<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>KIJA Financial & Operations Dashboard · Jababeka (IDX: KIJA)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231F5E40'/%3E%3Ctext x='32' y='46' font-size='38' text-anchor='middle' fill='%23F1F4EE' font-family='Arial' font-weight='700'%3EK%3C/text%3E%3C/svg%3E">
<style>
:root{
  --ink:#16241C; --paper:#EFF2EC; --card:#FFFFFF; --line:#DCE3D9;
  --green:#1F5E40; --green2:#4A8B66; --teal:#3E7D6B; --amber:#C07A2D; --clay:#B04A2E;
  --muted:#5C6B61; --ok:#2E7D4F; --warn:#C07A2D; --high:#B04A2E; --soft:#E4E9E0;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:auto}
body{font-family:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;background:var(--paper);color:var(--ink);line-height:1.55;font-size:14px}
header{background:var(--ink);color:#EDF2EC;padding:16px 22px 14px}
.hd-inner{max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hd-title{display:flex;align-items:center;gap:12px}
.logo{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:9px;background:var(--green);color:#EDF2EC;font-size:22px;font-weight:800}
.hd-title h1{font-size:20px;font-weight:700;letter-spacing:.3px}
.hd-title p{font-size:12px;color:#AFC2B4;margin-top:1px}
.hd-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.hd-meta{font-size:11px;color:#AFC2B4;text-align:right;line-height:1.6}
.langs{display:inline-flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);border-radius:8px;overflow:hidden}
.langs button{border:none;background:transparent;color:#C9D8CE;font-size:12px;padding:5px 13px;cursor:pointer;font-family:inherit}
.langs button+button{border-left:1px solid rgba(255,255,255,.22)}
.langs button.active{background:var(--green);color:#fff;font-weight:600}
nav.tabs{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}
.tabs-inner{max-width:1180px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:0 12px}
a.tab{display:inline-block;padding:11px 15px;font-size:13.5px;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap}
a.tab:hover{color:var(--green)}
a.tab.active{color:var(--green);border-bottom-color:var(--green);font-weight:600}
main{max-width:1180px;margin:0 auto;padding:18px 22px 34px}
.page{display:none}
.page.active{display:block}
.page-h{font-size:17px;font-weight:700;margin-bottom:4px}
.page-d{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.block-h{font-size:15px;font-weight:600;margin:6px 0 10px}
.phase{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 16px}
.chip{font-size:12px;color:var(--muted);border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 12px}
.chip b{color:var(--green)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:11px;margin-bottom:18px}
.kpis:has(> :nth-child(4):last-child){grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis:has(> :nth-child(6):last-child){grid-template-columns:repeat(6,minmax(0,1fr))}
.kpis:has(> :nth-child(8):last-child){grid-template-columns:repeat(8,minmax(0,1fr))}
@media(max-width:1199px){
  .kpis:has(> :nth-child(4):last-child){grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis:has(> :nth-child(6):last-child){grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpis:has(> :nth-child(8):last-child){grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media(max-width:699px){
  .kpis:has(> :nth-child(4):last-child){grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis:has(> :nth-child(6):last-child){grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis:has(> :nth-child(8):last-child){grid-template-columns:repeat(2,minmax(0,1fr))}
}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px 13px}
.kpi .lbl{font-size:12px;color:var(--muted)}
.kpi .val{font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;margin:2px 0 1px;line-height:1.2}
.kpi .val small{font-size:12px;font-weight:500;color:var(--muted)}
.kpi .del{font-size:12px;font-variant-numeric:tabular-nums}
.up{color:var(--ok)}.dn{color:var(--high)}.flat{color:var(--muted)}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:18px}
.chart-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px 8px}
.chart-card h3{font-size:14px;font-weight:600;margin-bottom:2px}
.chart-card .sub{font-size:11px;color:var(--muted);margin-bottom:6px}
.chart{width:100%;height:300px}
#v-1{height:430px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:18px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:13px 15px}
.panel h3{font-size:14px;font-weight:600;margin-bottom:8px}
.panel h3 .hint{font-weight:400;font-size:11px;color:var(--muted)}
ul.events{list-style:none}
ul.events li{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
ul.events li:last-child{border-bottom:none}
ul.events .d{flex:none;width:76px;color:var(--green);font-weight:600;font-variant-numeric:tabular-nums;font-size:12px;padding-top:1px}
.risk-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.risk-row:last-child{border-bottom:none}
.risk-row .nm{flex:1 1 34%;min-width:120px}
.risk-row .vv{flex:1 1 22%;font-weight:600;font-variant-numeric:tabular-nums;min-width:90px}
.risk-row .bar{flex:1 1 22%;height:7px;background:var(--soft);border-radius:4px;overflow:hidden;min-width:60px}
.risk-row .bar i{display:block;height:100%}
.badge{flex:none;font-size:11px;font-weight:600;border-radius:10px;padding:1px 9px;min-width:44px;text-align:center}
.lv-low{background:#DDEBDD;color:#1F5E40}
.lv-mid{background:#F3E3C8;color:#8A5A14}
.lv-high{background:#F0D5CC;color:#8F3520}
.risk-note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
.dir-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:11px;margin-bottom:18px}
.dir{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.dir .n{font-size:11px;font-weight:700;color:var(--green);letter-spacing:.5px}
.dir h4{font-size:14px;margin:3px 0 4px}
.dir p{font-size:12.5px;color:var(--muted)}
.tl{--date:66px;--axis:26px;--gap:12px;display:grid;grid-template-columns:var(--date) var(--axis) 1fr;column-gap:var(--gap);position:relative}
.tl::before{content:"";position:absolute;left:calc(var(--date) + var(--gap) + var(--axis)/2 - 1px);top:8px;bottom:8px;width:2px;background:var(--line)}
.tl .yr{font-weight:700;color:var(--green);text-align:right;padding-top:2px;font-size:15px}
.tl .dot{width:13px;height:13px;border-radius:50%;background:var(--green);justify-self:center;margin-top:5px;position:relative;z-index:1}
.tl .ev{margin-bottom:13px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px}
.tl .ev b{color:var(--green)}
.tl .ev .m{color:var(--muted);font-size:12px;margin-top:2px}
/* ===== 股权结构页 ===== */
.own-bars{display:flex;flex-direction:column;gap:9px;margin-bottom:18px}
.own-row{display:flex;align-items:center;gap:12px;font-size:13px}
.own-row .nm{flex:0 0 240px;color:var(--muted)}
.own-row .bar{flex:1;height:14px;background:var(--soft);border-radius:7px;overflow:hidden}
.own-row .bar i{display:block;height:100%;background:var(--green)}
.own-row .bar i.hl{background:var(--teal)}
.own-row .bar i.hl2{background:var(--green2)}
.own-row .vv{flex:0 0 90px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.hld{display:flex;flex-direction:column;align-items:center;margin-bottom:18px}
.hld-top{border:1px solid var(--ink);background:var(--ink);color:#EDF2EC;border-radius:9px;padding:9px 22px;text-align:center;min-width:260px}
.hld-top b{font-size:15px;display:block}
.hld-top span{font-size:11.5px;color:#AFC2B4}
.hld-line{width:2px;height:20px;background:var(--line)}
.hld-pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;position:relative}
.hld-pillars::before{content:"";position:absolute;top:-20px;left:16%;right:16%;height:2px;background:var(--line)}
.hld-pillar{border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px 10px 8px}
.hld-pillar h4{font-size:13px;margin-bottom:2px}
.hld-pillar .hld-kind{font-size:11px;color:var(--muted);margin-bottom:8px}
.hld-ents{display:flex;flex-direction:column;gap:6px}
.hld-ent{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:12.5px;padding:5px 8px;border:1px solid #E6EBE4;border-radius:6px;background:#FAFBF8;line-height:1.3}
.hld-ent .nm{font-weight:600}
.hld-ent .sub{font-size:11px;color:var(--muted);display:block}
.hld-ent .p{flex:none;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums}
.hld-ent.jv{border-color:#EAD9BC}
.hld-ent.jv .p{color:var(--amber)}
.hld-more{font-size:11.5px;color:var(--muted);margin-top:7px}
/* ===== 公司治理/组织页 ===== */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:18px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:11px 13px}
.fact .lbl{font-size:11.5px;color:var(--muted)}
.fact .val{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;line-height:1.25}
.fact .val small{font-size:11.5px;font-weight:500;color:var(--muted)}
.org{display:flex;flex-direction:column;align-items:center}
.org-box{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 18px;text-align:center;min-width:230px}
.org-box b{display:block;font-size:13.5px;line-height:1.35}
.org-box span{font-size:11.5px;color:var(--muted)}
.org-box.dark{background:var(--ink);border-color:var(--ink)}
.org-box.dark b{color:#EDF2EC}
.org-box.dark span{color:#AFC2B4}
.org-box.green{background:var(--green);border-color:var(--green)}
.org-box.green b{color:#fff}
.org-box.green span{color:#D6E4DA}
.org-line{width:2px;height:16px;background:var(--line);flex:none}
.org-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;width:100%;position:relative;padding-top:16px}
.org-row::before{content:"";position:absolute;top:0;left:12%;right:12%;height:2px;background:var(--line)}
.org-col{display:flex;flex-direction:column;align-items:center;flex:1 1 150px;max-width:230px}
.org-col .vline{width:2px;height:14px;background:var(--line);flex:none}
.g-table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:12.5px;table-layout:fixed;margin-bottom:18px}
.g-table th{background:var(--ink);color:#EDF2EC;padding:7px 9px;text-align:left;font-weight:600;font-size:12px;overflow-wrap:break-word;word-break:break-word}
.g-table td{padding:6px 9px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:top;overflow-wrap:break-word;word-break:break-word}
.g-table .gterm{white-space:normal}
.g-table tr:nth-child(even) td{background:#F7F9F5}
.g-table td.b{font-weight:700}
.g-table td.p{text-align:right;color:var(--green);font-weight:600}
.g-table td.amber{color:var(--amber);font-weight:600}
.g-table .gname{color:var(--muted);font-size:11.5px;font-weight:600;background:#EFF2EC}
.g-table-wrap{width:100%;overflow-x:auto;margin-bottom:18px}
.g-table-wrap .g-table{margin-bottom:0;min-width:640px}
footer{max-width:1180px;margin:0 auto;padding:6px 22px 30px;font-size:11px;color:var(--muted);line-height:1.7}
footer a{color:var(--green)}
.ft-ver{margin-top:8px;font-weight:600;color:var(--ink)}
.ft-log{margin-top:4px;font-weight:400}
.ft-log summary{cursor:pointer;color:var(--green);display:inline}
.ft-log ul{margin:6px 0 0 18px;padding:0}
.ft-log li{margin:2px 0}
.hl-driver{border-left:3px solid var(--green);margin-top:14px}
.hl-driver p{margin:6px 0 0}
#csvBtn{position:fixed;right:16px;bottom:16px;z-index:99;background:var(--ink);color:#EDF2EC;border:none;border-radius:20px;padding:8px 14px;font-size:12px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#csvBtn:hover{background:var(--green)}
@media(max-width:900px){
  .charts,.two-col{grid-template-columns:1fr}
  .chart{height:280px}
  .hd-right,.hd-meta{text-align:left;align-items:flex-start}
  main{padding:14px 14px 30px}
  .hld-pillars{grid-template-columns:1fr}
  .hld-pillars::before{display:none}
  .own-row .nm{flex-basis:150px}
}
/* ===== 术语悬停解释 ===== */
.gterm{border-bottom:1px dotted rgba(31,94,64,.55);cursor:help;white-space:nowrap}
.gterm.gterm-long{white-space:normal}
.gterm-q{display:inline-block;margin-left:1px;width:1.1em;height:1.1em;line-height:1.15em;text-align:center;border-radius:50%;background:rgba(176,74,46,.13);color:var(--high);font-size:.62em;font-weight:800;vertical-align:super;cursor:help}
.gterm-tip{position:fixed;z-index:3000;max-width:320px;background:var(--ink);color:#F2F5F1;font-size:12px;line-height:1.55;padding:8px 10px;border-radius:6px;box-shadow:0 8px 22px rgba(0,0,0,.3);display:none;pointer-events:auto;word-wrap:break-word}
.gterm-tip::before{content:"";position:absolute;left:12px;bottom:-5px;width:10px;height:10px;background:var(--ink);transform:rotate(45deg)}
.tab{font-weight:600}
</style>
</head>

<!-- ===== 视图：2025 年报 ===== -->
<section class="page" id="fy2025">
  <div class="kpis" id="k25"></div>
  <div class="charts">

  g24_t:'FY2024 growth drivers & highlights',
  g24:'Revenue rose 39% to IDR 4,602.6bn on a 44% jump in marketing sales (IDR 3,188bn), led by new Kendal land; net profit reached IDR 770.1bn despite a IDR 205.7bn FX loss. Recurring infrastructure (power, water, dry port) became a larger, more stable earnings base while land sales remained the main swing factor.',

  g25:'Revenue grew 12% to a record IDR 5,149.4bn and net profit 11% to IDR 857.1bn; recurring infrastructure mix rose to about 57% of revenue. Cash and equivalents jumped 77% to IDR 3,618.8bn (including JV dividends), and net debt fell to ~IDR 988bn (gross interest-bearing debt IDR 4,607bn). Gross margin held at 39% despite land-mix pressure.',

  g26:'Revenue fell 11% to IDR 2,436.5bn on softer Kendal land recognition, but operating profit held at IDR 524bn and infrastructure mix rose to 57%. The IDR 6.4bn net loss was driven by ~IDR 460bn one-off refinancing costs (FX 280.7, derivative 154.6, amortisation 24.9). Key H2 indicators: land sales timing and gross margin recovery.',

ble for generation, transmission and distribution."},{"p":"PP&E","x":"Property, Plant & Equipment — long-term tangible assets (land, buildings, machinery) used in operations."},{"p":"LNG","x":"Liquefied Natural Gas — natural gas cooled to liquid form for easier storage and transport."},{"p":"FX","x":"Foreign Exchange — currency conversion; an FX loss/gain arises from translating or settling foreign-currency assets and liabilities."},{"p":"RSI","x":"Relative Strength Index — a momentum oscillator on a 0–100 scale; above 70 is considered overbought, below 30 oversold."},{"p":"DPS","x":"Dividend Per Share — the dividend paid out per share (FY25: 2.03 IDR)."},{"p":"SBLC","x":"Standby Letter of Credit — a bank guarantee to pay a beneficiary if the applicant fails to meet a contractual or financial obligation."},{"p":"WWTP","x":"Wastewater Treatment Plant — a facility that treats industrial or municipal wastewater."},{"p":"MRT","x":"Mass Rapid Transit — a high-capacity urban rail system (e.g., Jakarta MRT)."},{"p":"MOU","x":"Memorandum of Understanding — a non-binding agreement outlining an intended partnership or cooperation."},{"p":"FDI","x":"Foreign Direct Investment — cross-border investment that gives the investor control or significant influence (typically ≥10% ownership)."},{"p":"AGM","x":"Annual General Meeting — the yearly shareholders' meeting where results are presented and resolutions are voted on."},{"p":"GMS","x":"General Meeting of Shareholders — the shareholders' meeting (in Indonesia: Rapat Umum Pemegang Saham, RUPS)."},{"p":"S&P","x":"Standard & Poor's — a credit-rating agency and index provider; KIJA's S&P rating is B- (speculative grade)."},{"p":"B3","x":"Moody's credit rating B3 — speculative grade, subject to high credit risk (KIJA's Moody's rating)."},{"p":"B-","x":"S&P credit rating B- — speculative grade, below investment grade."},{"p":"KPI","x":"Key Performance Indicator — a metric used to measure and track business performance."},{"p":"Beta","x":"Beta — a measure of a stock's volatility relative to the market; below 1 means less volatile than the market (KIJA 0.25)."},{"p":"YTD","x":"Year to Date — the period from the start of the calendar (or fiscal) year to the current date."},{"p":"PROPER","x":"PROPER — Indonesia's corporate environmental performance rating programme run by the Ministry of Environment (KLHK); 'green' is the second-highest level."},{"p":"1H(?=\\d)\\d*","x":"First half of the fiscal year (January–June); 1H26 = the unaudited interim period ended 30 Jun 2026."},{"p":"H1(?![A-Za-z])","x":"First half of the year (January–June)."},{"p":"FY(?![a-z])\\d*","x":"Fiscal Year — the company's annual reporting period; FY2025 = year ended 31 Dec 2025 (KIJA reports on calendar years)."},{"p":"AR(?=\\d)\\d*","x":"Annual Report — the company's audited annual disclosure to shareholders; e.g., AR2025 = the FY2025 annual report."},{"p":"Q[1-4](?![A-Za-z])","x":"Quarter — a three-month reporting period (Q1 = Jan–Mar, Q2 = Apr–Jun, Q3 = Jul–Sep, Q4 = Oct–Dec)."},{"p":"Liquidation value","x":"Liquidation value — what shareholders would receive per share if the company's assets were sold and liabilities settled today."},{"p":"Safety margin","x":"Safety margin — (estimated value − market price) ÷ estimated value; the discount to intrinsic value, shown only when value exceeds price."},{"p":"Fair value","x":"Fair value — an estimated intrinsic value of the company derived from valuation methods such as DCF or multiples."},{"p":"fair value","x":"Fair value — an estimated intrinsic value of the company derived from valuation methods such as DCF or multiples."},{"p":"Current / quick ratio","x":"Liquidity ratios: current ratio = current assets ÷ current liabilities (KIJA 5.6); quick ratio = (current assets − inventory) ÷ current liabilities (KIJA 2.0)."},{"p":"current ratio","x":"Current Ratio — current assets ÷ current liabilities; a company's ability to cover short-term obligations (KIJA 5.6 at 30 Jun 2026)."},{"p":"quick ratio","x":"Quick Ratio (acid-test) — (current assets − inventory) ÷ current liabilities; a stricter short-term liquidity test (KIJA 2.0)."},{"p":"Dividend yield","x":"Dividend Yield — annual dividend per share ÷ share price; the income return from dividends (1.1% at 180 IDR)."},{"p":"dividend yield","x":"Dividend Yield — annual dividend per share ÷ share price; the income return from dividends (1.1% at 180 IDR)."},{"p":"net debt","x":"Net Debt — total interest-bearing debt minus cash and equivalents; the debt remaining after using available cash (1H26: 4,863 − 3,200 = 1,663 bn)."},{"p":"Net debt","x":"Net Debt — total interest-bearing debt minus cash and equivalents; the debt remaining after using available cash (1H26: 4,863 − 3,200 = 1,663 bn)."},{"p":"Gross margin","x":"Gross Margin — (revenue − cost of goods sold) ÷ revenue; the share of sales left after direct production costs (FY25: 39%)."},{"p":"gross margin","x":"Gross Margin — (revenue − cost of goods sold) ÷ revenue; the share of sales left after direct production costs (FY25: 39%)."},{"p":"Net margin","x":"Net Margin — net profit ÷ revenue; the share of each rupiah of sales that ends up as bottom-line profit."},{"p":"net margin","x":"Net Margin — net profit ÷ revenue; the share of each rupiah of sales that ends up as bottom-line profit."},{"p":"Market capitalization","x":"Market Capitalisation — share price × number of shares; the total market value of a company's equity."},{"p":"market capitalization","x":"Market Capitalisation — share price × number of shares; the total market value of a company's equity."},{"p":"Market cap(?![a-z])","x":"Market Capitalisation — share price × number of shares; the total market value of a company's equity."},{"p":"market cap(?![a-z])","x":"Market Capitalisation — share price × number of shares; the total market value of a company's equity."},{"p":"Land bank","x":"Land bank — the inventory of developable land held by a property or industrial-estate developer for future sale and development."},{"p":"land bank","x":"Land bank — the inventory of developable land held by a property or industrial-estate developer for future sale and development."},{"p":"Land Bank","x":"Land bank — the inventory of developable land held by a property or industrial-estate developer for future sale and development."},{"p":"refinancing","x":"Refinancing — replacing existing debt with new borrowing, usually on better terms, lower cost or longer maturity."},{"p":"Refinancing","x":"Refinancing — replacing existing debt with new borrowing, usually on better terms, lower cost or longer maturity."},{"p":"leverage","x":"Leverage — the use of borrowed funds (debt) to finance assets; higher leverage amplifies both returns and risk."},{"p":"Debt/Equity","x":"Debt-to-Equity ratio — total debt ÷ shareholders' equity; the company's financial gearing."},{"p":"Liab/Equity","x":"Liabilities-to-Equity ratio — total liabilities ÷ shareholders' equity (85% at FY25)."},{"p":"senior notes","x":"Senior notes — unsecured bonds that rank ahead of subordinated debt in repayment priority."},{"p":"Term loan","x":"Term loan — a bank loan repaid in fixed instalments over a set maturity."},{"p":"term loan","x":"Term loan — a bank loan repaid in fixed instalments over a set maturity."},{"p":"Finance lease","x":"Finance lease — a lease that transfers substantially all risks and rewards of ownership; the asset and liability are recorded on the balance sheet."},{"p":"finance lease","x":"Finance lease — a lease that transfers substantially all risks and rewards of ownership; the asset and liability are recorded on the balance sheet."},{"p":"dry port","x":"Dry port — an inland intermodal terminal where cargo is handled away from the seaport (Cikarang Inland Port)."},{"p":"PT(?![A-Za-z])","x":"Perseroan Terbatas — Indonesian limited liability company; 'Tbk' after the name means it is publicly listed on the IDX."},{"p":"Tbk","x":"Terbuka — Indonesian designation for a company whose shares are publicly listed and traded on the stock exchange."},{"p":"KEK","x":"Kawasan Ekonomi Khusus — kawasan khusus dengan insentif pajak, bea cukai, dan perizinan untuk menarik investasi (special economic zone, SEZ)."},{"p":"KNP","x":"Kepentingan Non-Pengendali — bagian ekuitas anak perusahaan yang tidak dimiliki oleh induk (hak minoritas); dikurangkan dari ekuitas konsolidasi untuk memperoleh bagian induk."},{"p":"RUPS","x":"Rapat Umum Pemegang Saham — rapat tahunan pemegang saham untuk menyetujui laporan keuangan, dividen, dan keputusan penting perusahaan."},{"p":"SHGB","x":"Sertifikat Hak Guna Bangunan — hak untuk mendirikan dan memiliki bangunan di atas tanah milik orang lain/negara, umumnya berjangka 30 tahun dan dapat diperpanjang."},{"p":"Margin kotor","x":"Margin kotor = (pendapatan − beban pokok penjualan) ÷ pendapatan; bagian penjualan yang tersisa setelah biaya produksi langsung (FY2025: 39%)."},{"p":"Margin bersih","x":"Margin bersih = laba bersih ÷ pendapatan; porsi setiap rupiah penjualan yang menjadi laba akhir."},{"p":"Margin aman","x":"Margin aman = (nilai estimasi − harga pasar) ÷ nilai estimasi; diskon terhadap nilai intrinsik, hanya ditampilkan bila nilai melebihi harga."},{"p":"Utang bersih","x":"Utang bersih = total utang berbunga − kas dan setara kas; utang yang tersisa setelah memakai kas yang tersedia (1H26: 4.863 − 3.200 = 1.663 miliar)."},{"p":"Kapitalisasi pasar","x":"Kapitalisasi pasar = harga saham × jumlah saham; total nilai pasar ekuitas perusahaan."},{"p":"kepentingan non-pengendali","x":"Kepentingan non-pengendali (minoritas) — bagian ekuitas anak perusahaan yang tidak dimiliki induk; dikurangkan dari ekuitas konsolidasi untuk memperoleh bagian induk."},{"p":"Laba bersih","x":"Laba bersih = laba setelah seluruh beban, bunga, dan pajak; laba akhir perusahaan."},{"p":"Nilai buku","x":"Nilai buku (BVPS) = ekuitas per saham menurut pembukuan; aset bersih per saham berdasarkan laporan keuangan."},{"p":"Nilai likuidasi","x":"Nilai likuidasi — nilai per saham yang akan diterima pemegang saham bila aset perusahaan dijual dan liabilitas dilunasi saat ini."},{"p":"Imbal hasil dividen","x":"Imbal hasil dividen = dividen per saham ÷ harga saham; imbal hasil dari dividen (1,1% pada 180 IDR)."},{"p":"Dewan Komisaris","x":"Dewan Komisaris (board of commissioners) — organ pengawas yang mengawasi direksi atas nama pemegang saham."},{"p":"Direksi","x":"Direksi (board of directors) — pengelola harian perusahaan yang bertanggung jawab atas operasi dan strategi."},{"p":"Rapat Umum Pemegang Saham","x":"Rapat Umum Pemegang Saham (RUPS) — rapat tahunan pemegang saham untuk menyetujui laporan, dividen, dan keputusan penting."},{"p":"Sewa pembiayaan","x":"Sewa pembiayaan (finance lease) — sewa yang mengalihkan hampir seluruh risiko dan manfaat kepemilikan; aset dan liabilitas dicatat di neraca."},{"p":"归母净利","x":"归母净利 = 归属于母公司股东的净利润；从合并净利润中扣除少数股东损益后的部分（FY2025：423.2 十亿盾）。"},{"p":"少数股东权益","x":"少数股东权益（NCI）= 子公司权益中母公司未持有的部分；从合并权益中扣除以得出母公司股东权益。"},{"p":"毛利率","x":"毛利率 =（营业收入 − 营业成本）÷ 营业收入；扣除直接生产成本后剩余的销售占比（FY2025：39%）。"},{"p":"净利率","x":"净利率 = 净利润 ÷ 营业收入；每单位收入中最终成为净利润的比例。"},{"p":"净债务","x":"净债务 = 有息负债总额 − 现金及等价物；动用现有现金偿还后剩余的债务（1H26：4,863 − 3,200 = 1,663 十亿盾）。"},{"p":"市值","x":"市值 = 股价 × 总股本；公司股权的市场总价值。"},{"p":"土地储备","x":"土地储备（Land bank）= 开发商持有、备用于未来销售与开发的可开发土地库存。"},{"p":"清算价值","x":"清算价值 = 假设公司立即清算，资产变现扣除负债后可供股东分配的每股价值。"},{"p":"安全边际","x":"安全边际 =（估算价值 − 现价）÷ 估算价值；衡量现价相对内在价值的折让空间，仅当价值高于价格时显示。"},{"p":"股东大会","x":"股东大会（GMS / RUPS）= 公司最高权力机构，股东年度会议审议报告、分红与重大决议。"},{"p":"监事会","x":"监事会（Dewan Komisaris）= 代表股东监督董事会（管理层）的监督机构。"},{"p":"董事会","x":"董事会（Direksi）= 负责公司日常经营管理与战略执行的机构。"},{"p":"加权股本","x":"加权股本 = 按期间内流通时间加权平均的股本数，用于计算每股收益（EPS）等指标。"},{"p":"股息率","x":"股息率 = 每股股息 ÷ 股价；来自分红的收益回报（1.1%@180 盾）。"},{"p":"归母","x":"归母 = 归属于母公司股东（的口径）；用于区分合并口径与母公司股东口径。"},{"p":"少数股东","x":"少数股东 = 持有子公司少数股权的非控股股东。"},{"p":"CFO","x":"Cash flow from operating activities — net cash generated by the core business in a year; the cleanest earnings-quality check (KIJA FY25: IDR 2,402bn)."},{"p":"Operating cash flow","x":"Same as CFO: cash actually received from customers minus cash paid to suppliers, staff and tax, before investing/financing."},{"p":"capex","x":"Capital expenditure — cash spent on property, plant and equipment (not on land inventory). KIJA FY25: IDR 169bn."},{"p":"capital expenditure","x":"See capex; maintenance vs growth capex both reduce free cash flow."},{"p":"Land acquisition","x":"Cash paid to buy new land for the land bank; treated as inventory investment, not PP&E. KIJA FY25: IDR 496bn."},{"p":"Depreciation","x":"Systematic write-off of fixed asset cost over its useful life; non-cash expense added back in EBITDA."},{"p":"Amortization","x":"Write-off of intangible asset cost over its useful life; non-cash, added back in EBITDA."},{"p":"EBIT","x":"Earnings before interest and tax = operating profit; sits between gross profit and EBITDA."},{"p":"Operating profit","x":"Profit from core operations before interest and tax; equals EBIT."},{"p":"Gross profit","x":"Revenue minus cost of sales; profit before operating expenses."},{"p":"cash conversion","x":"How much accounting profit turns into actual cash; CFO divided by net profit over a period."}]};
var TOP3 = {"en":{"h":"Top 3 priorities to improve (data-derived)","sub":"Each tied to a measurable gap in the 2015-25 record and a plausible efficiency lever.","items":[["1. Scale profit at wholly-owned infra & service segments","Wholly-owned segments (Power, Estate services, Golf, Tourism) contributed IDR 751bn to parent in 2025 vs 369bn in 2024. Power swung from 56 to 316bn; Services 341 to 458bn; Tourism still loses 30bn.","Top 3 levers: (a) keep Power utilization high — Bekasi/United Power is 100%-owned; (b) grow estate services (water, dry port, warehousing, GPM ~46%); (c) turn Tourism around (lost 30bn both years). +50bn at wholly-owned subs → attributable profit 423bn → ~473bn (+12%)."],["2. Shift mix to recurring infrastructure","Gross margin peaked at ~52% (2022) then fell to 39% (2025) as low-margin land recognition grew; recurring infra EBITDA margin holds ~35%.","Power revenue already +54% in 2025; pushing power/water/dry-port volumes to ~60% of revenue would lift blended GPM by an estimated 2-3pct and stabilise quarterly earnings."],["3. De-risk land-sale timing","1H26 revenue -11% y/y on recognition timing; quarterly swings ±20%. DSO already improved to 37d and customer deposits rose to 316bn.","Converting more sales to take-or-pay / recurring service contracts and growing the pre-sales backlog would smooth revenue, reduce working-capital volatility and raise cash-conversion certainty."]]},"id":{"h":"3 prioritas utama perbaikan (berbasis data)","sub":"Tiap poin terkait gap terukur di data 2015-25 dan tuas efisiensi yang realistis.","items":[["1. Tingkatkan laba segmen infrastruktur & layanan milik penuh","Segmen milik penuh (Listrik, Jasa kawasan, Golf, Pariwisata) menyumbang Rp751 miliar ke induk di 2025 vs Rp369 miliar di 2024. Listrik naik 56→316 miliar; Jasa 341→458 miliar; Pariwisata masih rugi 30 miliar.","Tiga tuas: (a) jaga utilisasi listrik (Bekasi/United Power 100% milik); (b) tumbuhkan jasa kawasan (air, dry port, pergudangan, GPM ~46%); (c) pulihkan Pariwisata (rugi 30 miliar dua tahun). +50 miliar → laba induk 423 miliar→~473 miliar (+12%)."],["2. Geser bauran ke infrastruktur rutin","Margin kotor memuncak ~52% (2022) lalu turun ke 39% (2025) seiring pengakuan tanah; EBITDA infrastruktur rutin tetap ~35%.","Pendapatan listrik sudah +54% di 2025; mendorong volume listrik/air/dry port ke ~60% pendapatan akan menaikkan GPM blended sekitar 2-3pct dan menstabilkan laba triwulanan."],["3. Kurangi risiko timing penjualan tanah","Pendapatan 1H26 -11% y/y akibat timing; fluktuasi kuartalan ±20%. DSO sudah turun ke 37 hari dan uang muka pelanggan naik ke 316 miliar.","Mengubah sebagian penjualan menjadi kontrak take-or-pay / layanan rutin serta memperbesar backlog pre-sale akan memperhalus pendapatan dan meningkatkan kepastian konversi kas."]]},"zh":{"h":"三大改进优先项（基于历史数据）","sub":"每项对应 2015–25 数据中的可量化差距与可行效率杠杆。","items":[["1. 扩大全资基建与服务板块利润","全资板块（电力、园区服务、高尔夫、旅游）2025 年对母公司贡献 751 十亿盾（2024 年 369 十亿盾）。电力 56→316 十亿盾；服务 341→458 十亿盾；旅游仍亏 30 十亿盾。","三大抓手：(a) 保持电力高利用（Bekasi/United Power 100% 全资）；(b) 做大园区服务（水务、干港、仓储，毛利率 ~46%）；(c) 旅游扭亏（连亏两年 30 十亿盾）。全资板块 +50 十亿盾 → 归母 423 十亿盾→~473 十亿盾（+12%）。"],["2. 结构转向经常性基建","毛利率从 2022 年 52% 降至 2025 年 39%（低毛利土地确认占比上升）；经常性基建 EBITDA 率稳定在约 35%。","2025 年电力收入已 +54%；若将电力/水务/干港占收入比提至约 60%，综合毛利率可回升约 2–3 个百分点并稳定季度盈利。"],["3. 降低土地确认时点波动","1H26 收入同比 -11%（确认时点所致）；季度波动 ±20%。DSO 已降至 37 天，客户保证金升至 316 十亿盾。","把更多销售转为 take-or-pay / 经常性服务合同并扩大预售订单，可平滑收入、降低营运资本波动、提高现金转化确定性。"]]}};
var OPP = {"en":{"h":"Market opportunities (2026 context)","sub":"From CBRE Q2-2026 Greater Jakarta industrial report, Kendal SEZ updates and company disclosures.","items":[["Reshoring & China+1 to Cikarang","Cikarang remains SEA's largest industrial estate; land prices ~IDR 3.6m/sqm, +4% vs end-2025. EV-battery / nickel downstreaming and auto-electronics are the biggest inbound inflows."],["Kendal SEZ momentum","Three new investor MoUs signed Sept 2026 (synthetic leather, garment, hospitality); 144 tenants as of Aug 2026; low Central-Java labour cost suits labour-intensive manufacturing."],["2026 sales target 3,750","Company targets IDR 3,750bn marketing sales (Kendal 2,500 / Cikarang 1,250); 1Q26 realised 518bn. Pre-sales backlog supports the recurring-infra thesis."],["New products & self-use demand","Jababeka Bizpark phase-I handed over (IDR 1.65bn+ units, won Indonesia Property Award 2026); 1.2m local population and on-site dry port add captive B2C/B2B demand."],["Near net-cash balance sheet","FY2025 cash 3.6tn vs total debt 4.6tn; USD exposure hedged/cleared; 15-yr IDR funding at 7.0-7.5% — balance sheet now has capacity to fund land banking or buy out JV partners."]]},"id":{"h":"Peluang pasar (konteks 2026)","sub":"Dari laporan CBRE Q2-2026 Jabodetabek, update Kendal SEZ dan rilis perusahaan.","items":[["Reshoring & China+1 ke Cikarang","Cikarang tetap kawasan industri terbesar di Asia Tenggara; harga tanah ~Rp3,6juta/m2, +4% vs akhir 2025. Hilirirasi baterai EV/nikel serta otomotif-elektronik jadi arus masuk terbesar."],["Momentum Kendal SEZ","Tiga MoU investor baru ditandatangani Sept 2026 (kulit sintetis, garmen, perhotelan); 144 tenant per Agustus 2026; biaya tenaga kerja rendah Jawa Tengah cocok untuk industri padat karya."],["Target penjualan 2026: 3.750","Perusahaan menargetkan penjualan pemasaran Rp3.750 miliar (Kendal 2.500 / Cikarang 1.250); 1Q26 terealisasi 518 miliar. Backlog pre-sale mendukung tesis infrastruktur rutin."],["Produk baru & permintaan sendiri","Jababeka Bizpark fase-I diserahkan (unit mulai Rp1,65 miliar, menangkan Indonesia Property Award 2026); 1,2 juta penduduk lokal dan dry port di lokasi menambah permintaan B2C/B2B captive."],["Neraca mendekati net cash","Kas FY2025 3,6tn vs total utang 4,6tn; eksposur USD dilindungi/selesai; pendanaan IDR 15 thn bunga 7,0-7,5% — neraca kini punya kapasitas membiayai land bank atau membeli mitra JV."]]},"zh":{"h":"市场机会（2026 年环境）","sub":"来源：CBRE 2026 年二季度大雅加达工业地产报告、Kendal 经济特区动态及公司披露。","items":[["回流与中国+1 落地 Cikarang","Cikarang 仍是东南亚最大工业区；地价约 360 万盾/平方米，较 2025 年底 +4%。EV 电池/镍下游及汽车电子是最大外资流入。"],["Kendal 经济特区势头","2026 年 9 月新签三份投资备忘录（合成革、服装、酒店）；截至 2026 年 8 月共 144 家租户；中爪哇低人工成本适合劳动密集型制造。"],["2026 销售目标 3,750","公司目标营销销售 3.75 万亿盾（Kendal 2.5 万亿 / Cikarang 1.25 万亿）；1Q26 已实现 5,180 亿盾。预售订单支撑经常性基建逻辑。"],["新产品与自用需求","Jababeka Bizpark 一期交付（单价 16.5 亿盾起，获 2026 印尼地产奖）；本地 120 万人口与区内干港带来稳定 B2C/B2B 需求。"],["资产负债表近净现金","FY2025 现金 3.6 万亿 vs 总有息债 4.6 万亿；美元风险已对冲/清除；15 年期盾币融资 7.0–7.5%——资产负债表现有能力支持购地或收购合资方股权。"]]}};

var LANG = 'en';
try { var _s = localStorage.getItem('kija_lang'); if (_s === 'en' || _s === 'id' || _s === 'zh') { LANG = _s; } } catch (e) {}
function T(k){ return (I18N[LANG] && I18N[LANG][k]) || k; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtN(v){
  if (v === null || v === undefined || v === '') { return ''; }
  var n = Number(v);
  if (isNaN(n)) { return String(v); }
  var s = n.toFixed(1);
  if (s.charAt(s.length - 2) === '.' && s.charAt(s.length - 1) === '0') { s = s.slice(0, -2); }
  var parts = s.split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return parts.join('.');
}
var C = {green:'#1F5E40', green2:'#4A8B66', teal:'#3E7D6B', amber:'#C07A2D', clay:'#B04A2E', soft:'#C7D0C8', blue:'#2E6FB0', purple:'#7A5BA6', red:'#C0392B', gold:'#D9A53A'};
var AX = {color:'#5C6B61', fontSize:11};
var SPLIT = {lineStyle:{color:'#E3E8E1'}};

/* ================= 年度数据与图表文案（AN / CHT / FY 由 data.json 注入；在线时运行时拉取覆盖） ================= */
function CT(k){ return CHT[LANG][k] || k; }
function N(k){ return NXT[LANG][k] || k; }

/* ================= 图表构建（按当前语言） ================= */
function baseTooltip(){ return {trigger:'axis', confine:true}; }
function baseGrid(){ return {left:48, right:18, top:34, bottom:30}; }
function baseX(cats){ return {type:'category', data:cats, axisLabel:{color:AX.color, fontSize:11}, axisLine:{lineStyle:{color:'#B9C4BB'}}}; }
function baseY(name){ return {type:'value', name:name, nameTextStyle:{color:AX.color, fontSize:11}, axisLabel:{color:AX.color, fontSize:11}, splitLine:SPLIT}; }
function lblFmt(){ return function(p){ return fmtN(p.value); }; }
function legendT(){ return {top:2, right:6, textStyle:{color:AX.color, fontSize:11}, itemWidth:14}; }

function num(s){ var n = Number(String(s).replace(/,/g, '.')); return isNaN(n) ? 0 : n; }

    return {tooltip:tt, grid:baseGrid(), xAxis:baseX(AN.years), yAxis:baseY(U),

function exportCSV(){
  var page = document.querySelector('.page.active');
  if(!page){ return; }
  var tables = page.querySelectorAll('table');
  var rows = [], title = '';
  for(var t=0; t<tables.length; t++){
    var trs = tables[t].querySelectorAll('tr');
    if(t>0){ rows.push([]); }
    for(var r=0; r<trs.length; r++){
      var cells = trs[r].querySelectorAll('th,td');
      var line = [];
      for(var c=0; c<cells.length; c++){ line.push('"'+(cells[c].innerText||'').replace(/"/g,'""')+'"'); }
      rows.push(line);
    }
  }
  var csv = rows.map(function(r){return r.join(',');}).join('\r\n');
  var blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
  var a = document.createElement('a');

  a.download = 'KIJA_'+(currentPage())+'_'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

/* ================= 术语悬停解释（GLOS）================= */
var GTERM_OB = null;
function buildGtermRegex(){
  if (GTERM_OB) { return GTERM_OB; }
  var list = [];
  for (var gi = 0; gi < GLOS.terms.length; gi++) {
    list.push({p: GLOS.terms[gi].p, x: GLOS.terms[gi].x, r: GLOS.terms[gi].p.length});
  }
  list.sort(function(a, b){ return b.r - a.r; });
  var src = [];
  for (var j = 0; j < list.length; j++) { src.push('(' + list[j].p + ')'); }
  GTERM_OB = {re: new RegExp(src.join('|'), 'g'), list: list};
  return GTERM_OB;
}
function annotateTerms(root){
  var G = buildGtermRegex();
  var rootEl = root || document.body;
  var walker = document.createTreeWalker(rootEl, NodeFilter.SHOW_TEXT, null, false);
  var nodes = [];
  while (walker.nextNode()) { nodes.push(walker.currentNode); }
  var wrapped = 0;
  var seen = {};
  for (var n = 0; n < nodes.length; n++) {
    var node = nodes[n];
    if (!node.nodeValue) { continue; }
    var p = node.parentNode;
    if (!p || p.nodeType !== 1) { continue; }
    if (p.getAttribute('data-gterm')) { continue; }
    if (p.closest && p.closest('.gterm')) { continue; }
    var t = node.nodeValue;
    G.re.lastIndex = 0;
    var m = G.re.exec(t);
    if (!m) { continue; }
    G.re.lastIndex = 0;
    var parts = [];
    var last = 0;
    var mm;
    while ((mm = G.re.exec(t)) !== null) {
      if (mm.index > last) { parts.push(t.slice(last, mm.index)); }
      var gidx = 1;
      while (gidx < mm.length && mm[gidx] === undefined) { gidx++; }
      var full = mm[0];
      var entry = G.list[gidx - 1];
      var key = (entry.p || full).toLowerCase();
      if (seen[key]) {
        parts.push(esc(full));
      } else {
        seen[key] = 1;
        parts.push('<span class="gterm' + (full.length > 10 ? ' gterm-long' : '') + '" data-gterm="1" data-tip="' + esc(entry.x) + '">' + esc(full) + '<sup class="gterm-q">?</sup></span>');
      }
      last = mm.index + full.length;
      if (G.re.lastIndex === mm.index) { G.re.lastIndex = mm.index + full.length; }
    }
    if (last < t.length) { parts.push(t.slice(last)); }
    if (parts.length > 1) {
      var span = document.createElement('span');
      span.className = 'gterm-rt';
      span.innerHTML = parts.join('');
      p.replaceChild(span, node);
      wrapped++;
    }
  }
  return wrapped;
}
function gtermTarget(node){
  while (node && node.nodeType === 1) {
    if (node.getAttribute && node.getAttribute('data-gterm')) { return node; }
    node = node.parentNode;
  }
  return null;
}
function showTip(term){
  var tip = document.getElementById('gterm-tip');
  if (!tip) {
    tip = document.createElement('div');
    tip.id = 'gterm-tip';
    tip.className = 'gterm-tip';
    tip.setAttribute('role', 'tooltip');
    document.body.appendChild(tip);
  }
  tip.innerHTML = esc(term.getAttribute('data-tip') || '');
  tip.style.display = 'block';
  var r = term.getBoundingClientRect();
  var tw = tip.offsetWidth;
  var th = tip.offsetHeight;
  var x = r.left + r.width / 2 - tw / 2;
  if (x < 8) { x = 8; }
  if (x + tw > window.innerWidth - 8) { x = window.innerWidth - tw - 8; }
  var y = r.top - th - 10;
  if (y < 8) { y = r.bottom + 10; }
  tip.style.left = x + 'px';
  tip.style.top = y + 'px';
  tip._t = term;
}
function hideTip(){ var tip = document.getElementById('gterm-tip'); if (tip) { tip.style.display = 'none'; } }
document.addEventListener('mouseover', function(ev){
  var target = gtermTarget(ev.target);
  if (target) { showTip(target); } else { hideTip(); }
});
document.addEventListener('mouseout', function(ev){
  var t = gtermTarget(ev.target);
  if (t) { var rel = ev.relatedTarget; if (!rel || !gtermTarget(rel)) { hideTip(); } }
});
document.addEventListener('click', function(ev){
  var t = gtermTarget(ev.target);
  if (!t) { return; }
  var tip = document.getElementById('gterm-tip');
  if (tip && tip.style.display === 'block' && tip._t === t) { hideTip(); } else { showTip(t); }
});
window.addEventListener('scroll', hideTip, true);
window.addEventListener('resize', hideTip);

/* ================= 数据加载：优先在线拉取 data.json，失败回退内嵌副本 ================= */
var DATA_KEYS = ["KP","EV","RK","DIR","TL","OWN","SUBS","BIZ","VIA","PILLAR","PILLAR_MAP","ORG","DEBT","LAND","VAL","DTXT","LTXT","VTXT","NXT","VALI","LIQ","KEYP","AN","CHT","FY","LBV","GLOS","TOP3","OPP","DEC","SEG"];
function applyData(d){
  if (!d) { return; }
  for (var i = 0; i < DATA_KEYS.length; i++) {
    var k = DATA_KEYS[i];
    if (d[k] !== undefined) { window[k] = d[k]; }
  }
}
function loadData(cb){
  var done = false;
  function fin(){ if (!done) { done = true; cb(); } }
  if (location.protocol !== 'http:' && location.protocol !== 'https:') { fin(); return; }
  try {
    var r = new XMLHttpRequest();
    r.open('GET', 'data.json?v=' + Date.now(), true);
    r.onreadystatechange = function(){
      if (r.readyState === 4) {
        if (r.status === 200) {
          try { applyData(JSON.parse(r.responseText)); } catch (e) {}
        }
        fin();
      }
    };
    r.onerror = fin;
    r.send(null);
    setTimeout(fin, 5000);
  } catch (e) { fin(); }
}
function boot(){
  renderStatics();
  showPage(currentPage());
  loadECharts(function(){ renderPage(currentPage()); });
}
loadData(boot);
